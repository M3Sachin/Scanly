        /* Auto-calibration: the QR must sit fully INSIDE the illustration, but hand-picked
           rects leak the moment a shape tapers (a wine bowl, a star, a cone). So measure each
           shape once at startup instead of trusting authored numbers:
             1. draw the art alone over an OPAQUE background, art in a marker colour — drawing
                over an opaque bg matters, because a later body fill legitimately hides an
                earlier stroke, exactly as it does in the real render
             2. flood-fill from the border to find what is "outside" the illustration
             3. take the largest marker-free square in the enclosed interior → the QR rect
             4. if a shape is open (top bun + bottom bun with a gap), nothing is enclosed, so
                fall back to the largest marker-free square within the viewbox
             5. park the caption just below the artwork's real bottom edge
           Shrinking the QR rect costs no resolution: export scales by size/qr.width, so the QR
           still renders at the requested pixel size — only the surrounding artwork grows. */
        // Only reached if a shape draws nothing measurable — keeps it renderable rather than
        // leaving qr/cap.y undefined and painting NaN geometry.
        function seatFallback(s) {
            s.qr = [s.vb[0] * 0.1, s.vb[1] * 0.08, s.vb[0] * 0.8, s.vb[0] * 0.8];
            if (s.cap && s.cap.y === undefined) s.cap.y = s.vb[1] - s.cap.h;
        }

        function calibrateFrameShapes() {
            const U = 2, PAD = 24;
            const notes = [];

            // Largest all-free axis-aligned square within [x0,x1)x[y0,y1), preferring one
            // centred on the artwork and sitting high in the frame.
            function largestSquare(blocked, W, x0, y0, x1, y1, cxArt, maxOffset) {
                const dp = new Int32Array((x1 - x0 + 1) * 2);
                let prev = new Int32Array(x1 - x0 + 1), cur = new Int32Array(x1 - x0 + 1);
                let best = 0, bx = 0, by = 0, bestScore = Infinity;
                for (let y = y0; y < y1; y++) {
                    cur.fill(0);
                    for (let x = x0; x < x1; x++) {
                        const i = x - x0;
                        if (blocked[y * W + x]) { cur[i] = 0; continue; }
                        cur[i] = (i === 0 || y === y0) ? 1 : 1 + Math.min(cur[i - 1], prev[i], prev[i - 1]);
                        if (cur[i] >= best) {
                            const side = cur[i];
                            const off = Math.abs((x - side / 2) - cxArt);
                            // Used by the fallback pass: an unenclosed square must still sit on
                            // the artwork's axis, or it lands in dead space beside the subject
                            // (e.g. next to a martini stem) while technically touching no art.
                            if (maxOffset !== undefined && off > maxOffset) continue;
                            const score = off + (y - side) * 0.12;
                            if (side > best || score < bestScore) {
                                best = side; bestScore = score; bx = x - side + 1; by = y - side + 1;
                            }
                        }
                    }
                    const t = prev; prev = cur; cur = t;
                }
                return { side: best, x: bx, y: by };
            }

            for (const name of Object.keys(FRAME_SHAPES)) {
                const s = FRAME_SHAPES[name];
                const W = Math.ceil((s.vb[0] + PAD * 2) * U), H = Math.ceil((s.vb[1] + PAD * 2) * U);
                const cv = document.createElement('canvas');
                cv.width = W; cv.height = H;
                const ctx = cv.getContext('2d');
                ctx.scale(U, U); ctx.translate(PAD, PAD); ctx.lineJoin = 'round';
                s.draw(ctx, '#ff0000', '#ffffff');

                const data = ctx.getImageData(0, 0, W, H).data;
                const art = new Uint8Array(W * H);
                let minX = W, minY = H, maxX = -1, maxY = -1;
                for (let i = 0, p = 0; i < data.length; i += 4, p++) {
                    if (data[i + 3] > 60 && data[i] > 130 && data[i + 1] < 110) {
                        art[p] = 1;
                        const x = p % W, y = (p / W) | 0;
                        if (x < minX) minX = x; if (x > maxX) maxX = x;
                        if (y < minY) minY = y; if (y > maxY) maxY = y;
                    }
                }
                if (maxX < 0) { notes.push(name + ': no art drawn'); seatFallback(s); continue; }

                const outside = new Uint8Array(W * H);
                const stack = [0];
                outside[0] = 1;
                while (stack.length) {
                    const p = stack.pop(), x = p % W, y = (p / W) | 0;
                    if (x > 0 && !outside[p - 1] && !art[p - 1]) { outside[p - 1] = 1; stack.push(p - 1); }
                    if (x < W - 1 && !outside[p + 1] && !art[p + 1]) { outside[p + 1] = 1; stack.push(p + 1); }
                    if (y > 0 && !outside[p - W] && !art[p - W]) { outside[p - W] = 1; stack.push(p - W); }
                    if (y < H - 1 && !outside[p + W] && !art[p + W]) { outside[p + W] = 1; stack.push(p + W); }
                }

                const cxArt = (minX + maxX) / 2;
                const enclosedBlocked = new Uint8Array(W * H);
                for (let p = 0; p < art.length; p++) enclosedBlocked[p] = art[p] | outside[p];
                let pick = largestSquare(enclosedBlocked, W, 0, 0, W, H, cxArt);

                // Open silhouettes enclose nothing usable — fall back to the largest gap that
                // simply avoids the art and stays within the viewbox.
                const floor = 0.42 * Math.min(s.vb[0], s.vb[1]) * U;
                if (pick.side < floor) {
                    const alt = largestSquare(art, W, PAD * U, PAD * U,
                        Math.floor((PAD + s.vb[0]) * U), Math.floor((PAD + s.vb[1]) * U), cxArt,
                        (maxX - minX) * 0.16);
                    if (alt.side > pick.side) pick = alt;
                }
                if (pick.side < 20) { notes.push(name + ': no usable area'); seatFallback(s); continue; }

                const inset = 1.4;
                const qs = pick.side / U - inset * 2;
                s.qr = [+(pick.x / U - PAD + inset).toFixed(1), +(pick.y / U - PAD + inset).toFixed(1),
                        +qs.toFixed(1), +qs.toFixed(1)];

                const artR = maxX / U - PAD, artB = maxY / U - PAD;
                if (minX / U - PAD < -0.5 || minY / U - PAD < -0.5) notes.push(name + ': art starts off-canvas');
                s.vb[0] = Math.max(s.vb[0], Math.ceil(artR + 3));
                if (s.cap && s.cap.on === false) {
                    s.cap.y = +(artB + s.cap.h * 0.85).toFixed(1);
                    s.vb[1] = Math.ceil(s.cap.y + s.cap.h * 0.85 + 2);
                } else {
                    s.vb[1] = Math.max(s.vb[1], Math.ceil(artB + 3));
                }
            }
            return notes;
        }

        // Renders the QR inside a frame illustration. `cfg` defaults to the live state, but the
        // preset gallery overrides it to draw accurate thumbnails of any frame.
        function composeFramedCanvas(qrImage, size, cfg) {
            const conf = cfg || { shape: state.frameStyle, icon: state.frameIcon, text: state.frameText, color: state.frameColor, bg: state.bgColor };
            const shape = FRAME_SHAPES[conf.shape];

            if (!shape) {   // 'none' or unknown → plain QR at requested size
                const plain = document.createElement('canvas');
                plain.width = size; plain.height = size;
                plain.getContext('2d').drawImage(qrImage, 0, 0, size, size);
                return plain;
            }

            const q = shape.qr;
            const unit = size / q[2];               // scale so the QR itself lands at `size` px
            const out = document.createElement('canvas');
            out.width = Math.round(shape.vb[0] * unit);
            out.height = Math.round(shape.vb[1] * unit);
            const ctx = out.getContext('2d');
            ctx.scale(unit, unit);

            ctx.fillStyle = conf.bg;
            ctx.fillRect(0, 0, shape.vb[0], shape.vb[1]);
            ctx.lineJoin = 'round';
            shape.draw(ctx, conf.color, conf.bg);

            // Always keep a clean white-ish bed under the QR so scannability never depends on art
            ctx.fillStyle = conf.bg;
            ctx.fillRect(q[0], q[1], q[2], q[3]);
            ctx.drawImage(qrImage, q[0], q[1], q[2], q[3]);

            // Badge-style frames host the icon inside their emblem instead of beside the caption
            if (shape.icon) {
                const glyph = getFaGlyph(conf.icon);
                if (glyph) {
                    ctx.fillStyle = conf.bg;
                    ctx.font = `900 ${shape.icon.size}px "Font Awesome 6 Free"`;
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText(glyph, shape.icon.x, shape.icon.y + shape.icon.size * 0.04);
                }
            }

            if (shape.cap && (conf.text || conf.icon)) {
                const onBand = shape.cap.on;
                drawIconText(ctx, shape.vb[0] / 2, shape.cap.y, shape.cap.h,
                    onBand ? conf.bg : conf.color,
                    shape.icon ? null : conf.icon, conf.text);
            }
            return out;
        }

        // Guards against overlapping async renders (e.g. rapid typing) painting out of order.
        let renderGeneration = 0;

        // Waits for the QR to actually finish drawing, then paints it (with frame) into the preview.
        async function paintContainer(instance, size) {
            const gen = ++renderGeneration;
            const qrImage = await getQRImage(instance);
            if (gen !== renderGeneration) return; // a newer render started meanwhile — discard
            const container = document.getElementById('qr-container');
            container.innerHTML = '';
            container.appendChild(composeFramedCanvas(qrImage, size));
        }

        async function initQR() {
            if (typeof QRCodeStyling === 'undefined') {
                document.getElementById('qr-container').innerHTML = '<p class="text-red-400 text-sm">Failed to load QR library. Please refresh.</p>';
                return;
            }
            qrCode = new QRCodeStyling(buildQROptions('https://example.com', QR_DISPLAY_SIZE));
            await paintContainer(qrCode, QR_DISPLAY_SIZE);
        }

        let updateTimer = null;
        function scheduleUpdate() {
            clearTimeout(updateTimer);
            updateTimer = setTimeout(updateQR, 120);
        }

        // Max byte capacity of a QR code (version 40, byte mode) per error-correction level.
        // This is a hard ceiling defined by the QR standard (ISO/IEC 18004) — not adjustable.
        const QR_MAX_BYTES = { L: 2953, M: 2331, Q: 1663, H: 1273 };

        function qrErrorMessage(err, level) {
            if (/overflow/i.test(String(err && err.message || err || ''))) {
                const max = QR_MAX_BYTES[level || state.errorCorrection];
                return `That content is too long for a QR code (max ~${max.toLocaleString()} bytes, even at the lowest error-correction level). Shorten it and try again.`;
            }
            return 'Could not generate a QR code for that content.';
        }

        function showQrError(message) {
            document.getElementById('qr-container').innerHTML =
                `<div class="empty-state"><i class="fa-solid fa-triangle-exclamation"></i><span class="text-sm" style="max-width:220px;">${message}</span></div>`;
        }

        function updateCapacityIndicator() {
            const el = document.getElementById('capacity-indicator');
            if (!el) return;
            const data = getQRData(state.currentType);
            const bytes = new TextEncoder().encode(data || '').length;
            const max = QR_MAX_BYTES[state.errorCorrection];
            const overLimit = bytes > max;
            el.textContent = `${bytes.toLocaleString()} / ${max.toLocaleString()} bytes used`;
            el.style.color = overLimit ? '#EF4444' : '';
        }

        // Try to render at the current error-correction level; if the content overflows,
        // automatically retry at L (the level with the most capacity) before giving up.
        function renderQRWithFallback(data, size) {
            try {
                if (!qrCode) qrCode = new QRCodeStyling(buildQROptions(data, size));
                else qrCode.update(buildQROptions(data, size));
                return { ok: true };
            } catch (err) {
                if (state.errorCorrection === 'L') return { ok: false, message: qrErrorMessage(err) };
                const opts = buildQROptions(data, size);
                opts.qrOptions.errorCorrectionLevel = 'L';
                try {
                    if (!qrCode) qrCode = new QRCodeStyling(opts);
                    else qrCode.update(opts);
                    state.errorCorrection = 'L';
                    renderStyleButtons('ec-levels', ecLevels, 'errorCorrection', { title: e => `${e.desc} recovery` });
                    updateCapacityIndicator();
                    toast('Content is large — switched error correction to L to fit it.', 'info');
                    return { ok: true };
                } catch (err2) {
                    return { ok: false, message: qrErrorMessage(err2, 'L') };
                }
            }
        }

        async function updateQR() {
            if (!qrCode) return;
            const data = getQRData(state.currentType);
            updateCapacityIndicator();
            if (!data) {
                document.getElementById('qr-container').innerHTML = '<div class="empty-state"><i class="fa-solid fa-qrcode"></i><span class="text-sm">Enter data to generate</span></div>';
                return;
            }
            const result = renderQRWithFallback(data, QR_DISPLAY_SIZE);
            if (!result.ok) {
                showQrError(result.message);
                toast(result.message, 'error');
                return;
            }
            await paintContainer(qrCode, QR_DISPLAY_SIZE);
            // Update frame background
            document.getElementById('qr-frame').style.backgroundColor = state.bgColor;
            // Pop animation
            const frame = document.getElementById('qr-frame');
            frame.classList.remove('qr-pop');
            void frame.offsetWidth;
            frame.classList.add('qr-pop');
        }

        async function updateQRStyle() {
            if (!qrCode) return;
            const data = getQRData(state.currentType) || ' ';
            updateCapacityIndicator();
            const result = renderQRWithFallback(data, QR_DISPLAY_SIZE);
            if (!result.ok) {
                showQrError(result.message);
                toast(result.message, 'error');
                return;
            }
            await paintContainer(qrCode, QR_DISPLAY_SIZE);
            document.getElementById('qr-frame').style.backgroundColor = state.bgColor;
        }

        /* ===== Render UI Components ===== */
        function renderTypeBar() {
            const bar = document.getElementById('type-bar');
            bar.innerHTML = types.map(t =>
                `<button class="type-pill ${t.id === state.currentType ? 'active' : ''}" data-type="${t.id}" role="tab" aria-selected="${t.id === state.currentType}"><i class="${t.iconStyle || 'fa-solid'} ${t.icon}"></i><span>${t.label}</span></button>`
            ).join('');
        }

        function renderForm() {
            const info = types.find(t => t.id === state.currentType);
            document.getElementById('form-header').innerHTML = `<h2 class="text-xl font-bold">${info.title}</h2><p class="text-sm text-sub mt-1">${info.desc}</p>`;
            document.getElementById('form-body').innerHTML = getFormHTML(state.currentType);
            attachFormListeners();
        }

        function renderStyleButtons(containerId, items, stateKey, opts = {}) {
            const el = document.getElementById(containerId);
            el.innerHTML = items.map(i => {
                const title = opts.title ? ` title="${opts.title(i)}"` : '';
                return `<button class="style-btn ${i.id === state[stateKey] ? 'active' : ''}" data-val="${i.id}"${title}>${i.label}${opts.suffix || ''}</button>`;
            }).join('');
        }

        function syncFrameOptionsVisibility() {
            document.getElementById('frame-opts').classList.toggle('hidden', state.frameStyle === 'none');
            document.getElementById('frame-text-wrap').classList.toggle('hidden', state.frameStyle === 'border');
        }

        // A stand-in QR bitmap for gallery thumbnails — real enough to read as "a QR code"
        // without generating 57 actual QR codes just to draw previews.
        let placeholderQR = null;
        function getPlaceholderQR() {
            if (placeholderQR) return placeholderQR;
            const n = 21, cell = 6, s = n * cell;
            const c = document.createElement('canvas');
            c.width = s; c.height = s;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, s, s);
            ctx.fillStyle = '#3F3F46';
            // Deterministic pseudo-random speckle (no Math.random — thumbnails must be stable)
            for (let y = 0; y < n; y++) {
                for (let x = 0; x < n; x++) {
                    if (((x * 7 + y * 13 + x * y * 3) % 5) < 2) ctx.fillRect(x * cell, y * cell, cell, cell);
                }
            }
            // Three finder patterns, so it unmistakably reads as a QR code
            const finder = (fx, fy) => {
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(fx * cell, fy * cell, cell * 7, cell * 7);
                ctx.fillStyle = '#3F3F46';
                ctx.fillRect(fx * cell, fy * cell, cell * 7, cell);
                ctx.fillRect(fx * cell, (fy + 6) * cell, cell * 7, cell);
                ctx.fillRect(fx * cell, fy * cell, cell, cell * 7);
                ctx.fillRect((fx + 6) * cell, fy * cell, cell, cell * 7);
                ctx.fillRect((fx + 2) * cell, (fy + 2) * cell, cell * 3, cell * 3);
            };
            finder(0, 0); finder(n - 7, 0); finder(0, n - 7);
            placeholderQR = c;
            return c;
        }

        // Builds each card's preview by running the REAL frame renderer, so what you see in
        // the gallery is exactly what the frame produces — just with a placeholder QR inside.
        // Thumbnails never change, so they are rendered once and cached: regenerating 57
        // canvases on every click made the whole panel feel sluggish.
        let framePresetThumbs = null;
        function renderFramePresets() {
            const el = document.getElementById('frame-presets');
            if (!framePresetThumbs) {
                const qr = getPlaceholderQR();
                framePresetThumbs = framePresets.map(p => composeFramedCanvas(qr, 116, {
                    shape: p.shape, icon: p.icon, text: p.text, color: p.color, bg: '#ffffff'
                }).toDataURL('image/png'));
            }
            el.innerHTML = framePresets.map((p, i) => `
                <button class="frame-preset-card ${state.framePresetId === p.id ? 'active' : ''}" data-id="${p.id}" title="${p.label}">
                    <span class="frame-preset-thumb"><img src="${framePresetThumbs[i]}" alt="${p.label} frame" loading="lazy"></span>
                    <span class="frame-preset-name">${p.label}</span>
                </button>`).join('');
        }

        // Cheap highlight-only update for when the selection changes.
        function syncFramePresetActive() {
            document.querySelectorAll('.frame-preset-card').forEach(b =>
                b.classList.toggle('active', b.dataset.id === state.framePresetId));
        }

        /* ===== Event Listeners ===== */
        function attachFormListeners() {
            // All form inputs trigger QR update
            document.querySelectorAll('#form-body .form-input').forEach(el => {
                el.addEventListener('input', scheduleUpdate);
            });
            // WiFi password toggle
            const toggleBtn = document.getElementById('toggle-pass');
            if (toggleBtn) {
                toggleBtn.addEventListener('click', () => {
                    const inp = document.getElementById('f-wifipass');
                    const isPass = inp.type === 'password';
                    inp.type = isPass ? 'text' : 'password';
                    toggleBtn.innerHTML = isPass ? '<i class="fa-solid fa-eye-slash text-sm"></i>' : '<i class="fa-solid fa-eye text-sm"></i>';
                });
            }
            // WiFi encryption change
            const encSelect = document.getElementById('f-enc');
            if (encSelect) {
                encSelect.addEventListener('change', () => {
                    const passGroup = document.getElementById('wifi-pass-group');
                    if (passGroup) passGroup.style.display = encSelect.value === 'nopass' ? 'none' : 'block';
                    scheduleUpdate();
                });
            }
            // File tab: pick a file, then upload it on an explicit click
            const fileDrop = document.getElementById('file-drop');
            if (fileDrop) {
                const picker = document.getElementById('f-fileinput');
                const btn = document.getElementById('file-upload-btn');
                const statusEl = document.getElementById('file-status');
                const setStatus = m => { statusEl.textContent = m; };
                let chosen = null;

                const showChosen = f => {
                    chosen = f;
                    document.getElementById('file-idle').classList.toggle('hidden', !!f);
                    document.getElementById('file-chosen').classList.toggle('hidden', !f);
                    if (f) document.getElementById('file-chosen-name').textContent =
                        `${f.name} (${f.size < 1024 * 1024
                            ? Math.max(1, Math.round(f.size / 1024)) + ' KB'
                            : (f.size / 1024 / 1024).toFixed(1) + ' MB'})`;
                    btn.disabled = !f;
                    fileDrop.classList.toggle('has-logo', !!f);
                };

                const accept = f => {
                    if (!f) return;
                    if (f.size > MAX_UPLOAD_BYTES) { toast('That file is over the 100MB limit', 'error'); return; }
                    setStatus(''); showChosen(f);
                };

                fileDrop.addEventListener('click', e => { if (!e.target.closest('#file-clear')) picker.click(); });
                fileDrop.addEventListener('dragover', e => { e.preventDefault(); fileDrop.style.borderColor = 'rgba(255,92,57,0.5)'; });
                fileDrop.addEventListener('dragleave', () => { fileDrop.style.borderColor = ''; });
                fileDrop.addEventListener('drop', e => {
                    e.preventDefault(); fileDrop.style.borderColor = '';
                    accept(e.dataTransfer.files[0]);
                });
                picker.addEventListener('change', () => accept(picker.files[0]));
                document.getElementById('file-clear').addEventListener('click', e => {
                    e.stopPropagation(); picker.value = ''; showChosen(null); setStatus('');
                });

                const retentionNote = () => {
                    const h = FILE_HOSTS[state.fileRetention];
                    document.getElementById('file-retention-note').textContent =
                        state.fileRetention === 'short'
                            ? `Goes to ${h.name} and is deleted automatically after ${h.lifetime} — nothing piles up.`
                            : `Goes to ${h.name}, which sets no fixed expiry. Better for printed codes, but the file stays there.`;
                };
                retentionNote();

                document.getElementById('file-retention').addEventListener('click', e => {
                    const b = e.target.closest('.style-btn');
                    if (!b) return;
                    state.fileRetention = b.dataset.val;
                    document.querySelectorAll('#file-retention .style-btn').forEach(x =>
                        x.classList.toggle('active', x.dataset.val === state.fileRetention));
                    retentionNote();
                });

                document.getElementById('file-remind').addEventListener('click', armExpiryReminder);

                // Restore a previous upload so the countdown survives a reload
                const rec = loadUploadRecord();
                if (rec) {
                    if (rec.expired) {
                        state.fileUrl = ''; state.fileExpiresAt = null;
                        setStatus('Your last upload has expired — upload again for a fresh link.');
                    } else {
                        state.fileUrl = rec.url; state.fileName = rec.name;
                        state.fileHostName = rec.host; state.fileExpiresAt = rec.expiresAt;
                        state.fileRetention = rec.retention || state.fileRetention;
                        document.getElementById('file-link-wrap').classList.remove('hidden');
                        document.getElementById('f-fileurl').value = rec.url;
                        document.getElementById('file-remind-wrap').classList.toggle('hidden', !rec.expiresAt);
                        setStatus(`Previously uploaded to ${rec.host}.`);
                        startExpiryTicker();
                        scheduleUpdate();
                    }
                }

                btn.addEventListener('click', async () => {
                    if (!chosen) return;
                    // Guard against overlapping uploads: without this, a slower earlier upload
                    // can resolve last and clobber the link the user actually just made.
                    const gen = ++uploadGeneration;
                    btn.disabled = true;
                    try {
                        // No fallback to the other host: silently turning a "temporary" link
                        // permanent (or vice-versa) would break the choice just made.
                        const host = FILE_HOSTS[state.fileRetention];
                        const link = await postFile(host, chosen, p => {
                            if (gen === uploadGeneration) setStatus(`Uploading to ${host.name}\u2026 ${Math.round(p * 100)}%`);
                        });
                        if (gen !== uploadGeneration) return;   // superseded — discard
                        state.fileUrl = link;
                        state.fileName = chosen.name;
                        state.fileHostName = host.name;
                        state.fileExpiresAt = host.ttlMs ? Date.now() + host.ttlMs : null;
                        saveUploadRecord();
                        document.getElementById('file-link-wrap').classList.remove('hidden');
                        document.getElementById('f-fileurl').value = link;
                        document.getElementById('file-remind-wrap').classList.toggle('hidden', !state.fileExpiresAt);
                        setStatus(`Uploaded to ${host.name} — ${host.lifetime}.`);
                        startExpiryTicker();
                        scheduleExpiryNotification();
                        toast('File uploaded — QR now points to it', 'success');
                        scheduleUpdate();
                    } catch (err) {
                        if (gen !== uploadGeneration) return;
                        setStatus('');
                        toast((err.message || 'Upload failed') + ' — try the other lifetime option.', 'error');
                    } finally { if (gen === uploadGeneration) btn.disabled = !chosen; }
                });
            }

            // Text tab: document upload -> extract text into textarea
            const textFileInput = document.getElementById('text-file-input');
            if (textFileInput) {
                textFileInput.addEventListener('change', async () => {
                    const file = textFileInput.files[0];
                    if (!file) return;
                    const statusEl = document.getElementById('text-file-status');
                    statusEl.textContent = `Reading ${file.name}…`;
                    try {
                        const text = await extractTextFromFile(file);
                        document.getElementById('f-text').value = text;
                        statusEl.textContent = `Loaded from ${file.name}`;
                        scheduleUpdate();
                        toast(`Extracted text from ${file.name}`, 'success');
                    } catch (err) {
                        statusEl.textContent = '';
                        toast(err.message || 'Could not read that file', 'error');
                    } finally {
                        textFileInput.value = '';
                    }
                });
            }
        }

        /* ===== Document text extraction (Text tab upload) ===== */
        if (typeof pdfjsLib !== 'undefined') {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }

        async function extractTextFromFile(file) {
            const name = file.name.toLowerCase();
            if (name.endsWith('.pdf')) return extractPdfText(file);
            if (name.endsWith('.docx')) return extractDocxText(file);
            if (name.endsWith('.doc')) throw new Error('Legacy .doc isn\'t supported — save as .docx or PDF and try again.');
            if (name.endsWith('.txt') || name.endsWith('.md') || name.endsWith('.markdown') || file.type.startsWith('text/')) {
                return (await file.text()).trim();
            }
            throw new Error('Unsupported file type.');
        }

        async function extractPdfText(file) {
            const buffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
            let text = '';
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const content = await page.getTextContent();
                text += content.items.map(it => it.str).join(' ') + '\n\n';
            }
            return text.trim();
        }

        /* ===== File upload (File tab) =====
           A QR code tops out at ~2.9KB, so a real document can never live inside the code
           itself — the only thing that fits is a link. We upload to catbox.moe (permanent,
           200MB) and fall back to uguu.se (3h retention) if that host is down. This is the
           one place in Scanly where data leaves the browser, so it only ever happens on an
           explicit button press and the UI says so plainly. */
        /* Neither host lets us set an arbitrary expiry — the lifetime IS the host, so the
           "how long" choice picks where the file goes. (catbox's temporary service,
           litterbox, would allow 1h/12h/24h/72h but blocks browser uploads with a 403.) */
        /* Hosts must send CORS headers, or the browser blocks reading the response and the
           upload fails from any real origin. catbox.moe and uguu.se send none — they only
           appeared to work from a file:// page, where the origin is null. Both hosts below
           were verified to return `Access-Control-Allow-Origin: *`.
           Neither lets us set an arbitrary expiry: the lifetime is a property of the host,
           so the "how long" choice picks where the file goes. */
        const FILE_HOSTS = {
            short: {
                name: 'tmpfiles.org', lifetime: 'about 1 hour', ttlMs: 60 * 60 * 1000,
                url: 'https://tmpfiles.org/api/v1/upload',
                form: (file) => { const fd = new FormData(); fd.append('file', file, safeUploadName(file.name)); return fd; },
                parse: (txt) => {
                    try {
                        const url = JSON.parse(txt).data.url;
                        // /dl/ is the download entry point rather than the preview page
                        return url ? url.replace('tmpfiles.org/', 'tmpfiles.org/dl/') : null;
                    } catch { return null; }
                },
            },
            long: {
                name: 'gofile.io', lifetime: 'no fixed expiry', ttlMs: null,
                // gofile hands out a storage server per upload, so the endpoint is resolved first
                resolve: async () => {
                    const r = await fetch('https://api.gofile.io/servers');
                    const server = (await r.json()).data.servers[0].name;
                    return `https://${server}.gofile.io/contents/uploadfile`;
                },
                form: (file) => { const fd = new FormData(); fd.append('file', file, safeUploadName(file.name)); return fd; },
                parse: (txt) => { try { return JSON.parse(txt).data.downloadPage || null; } catch { return null; } },
            },
        };

        // tmpfiles.org rejects very short or unusual names with "Invalid file name", which
        // would surface as a baffling upload failure, so normalise before sending.
        function safeUploadName(name) {
            const dot = name.lastIndexOf('.');
            const ext = dot > 0 ? name.slice(dot).toLowerCase().replace(/[^.a-z0-9]/g, '') : '';
            let base = (dot > 0 ? name.slice(0, dot) : name)
                .replace(/[^\w-]+/g, '-').replace(/^-+|-+$/g, '');
            if (base.length < 6) base = 'scanly-' + (base || 'file');
            return base.slice(0, 60) + ext;
        }

        const MAX_UPLOAD_BYTES = 100 * 1024 * 1024;   // tmpfiles.org caps at 100MB

        async function postFile(host, file, onProgress) {
            const endpoint = host.resolve ? await host.resolve() : host.url;
            return new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();
                xhr.open('POST', endpoint);
                xhr.upload.addEventListener('progress', e => {
                    if (e.lengthComputable) onProgress(e.loaded / e.total);
                });
                xhr.onload = () => {
                    const link = xhr.status >= 200 && xhr.status < 300 ? host.parse(xhr.responseText) : null;
                    link ? resolve(link) : reject(new Error(host.name + ' returned ' + xhr.status));
                };
                // A cross-origin POST that the browser blocks surfaces here with no status,
                // so name CORS explicitly instead of implying the host is down.
                xhr.onerror = () => reject(new Error(
                    `Could not reach ${host.name} — the host refused the browser request.`));
                xhr.send(host.form(file));
            });
        }

        /* ===== Link expiry tracking =====
           Temporary links die on the host's schedule, so remember when and count down. The
           record is kept in localStorage so the countdown survives a reload. */
        const UPLOAD_STORE_KEY = 'scanly-last-upload';
        let uploadGeneration = 0;
        let expiryTicker = null, expiryNotifyTimer = null;

        function saveUploadRecord() {
            try {
                localStorage.setItem(UPLOAD_STORE_KEY, JSON.stringify({
                    url: state.fileUrl, name: state.fileName, host: state.fileHostName,
                    retention: state.fileRetention, expiresAt: state.fileExpiresAt,
                }));
            } catch (err) { /* private mode — countdown just won't survive a reload */ }
        }

        function loadUploadRecord() {
            try {
                const rec = JSON.parse(localStorage.getItem(UPLOAD_STORE_KEY) || 'null');
                if (!rec || !rec.url) return null;
                if (rec.expiresAt && Date.now() > rec.expiresAt) return { ...rec, expired: true };
                return rec;
            } catch (err) { return null; }
        }

        function formatRemaining(ms) {
            const m = Math.floor(ms / 60000), h = Math.floor(m / 60);
            if (h > 0) return `${h}h ${m % 60}m`;
            if (m > 0) return `${m}m`;
            return 'less than a minute';
        }

        function renderExpiry() {
            const el = document.getElementById('file-expiry');
            if (!el) return;
            if (!state.fileUrl) { el.textContent = ''; return; }
            if (!state.fileExpiresAt) {
                el.className = 'text-[11px] mt-2 expiry-ok';
                el.textContent = `Hosted on ${state.fileHostName} — no fixed expiry, but retention is up to the host.`;
                return;
            }
            const left = state.fileExpiresAt - Date.now();
            if (left <= 0) {
                el.className = 'text-[11px] mt-2 expiry-dead';
                el.textContent = 'This link has expired — the file was deleted by the host. Upload again to get a fresh link.';
            } else {
                el.className = 'text-[11px] mt-2 ' + (left < 30 * 60 * 1000 ? 'expiry-warn' : 'expiry-ok');
                el.textContent = `Expires in ${formatRemaining(left)} (around ${new Date(state.fileExpiresAt).toLocaleTimeString()}).`;
            }
        }

        function startExpiryTicker() {
            clearInterval(expiryTicker);
            renderExpiry();
            expiryTicker = setInterval(renderExpiry, 15000);
        }

        function scheduleExpiryNotification() {
            clearTimeout(expiryNotifyTimer);
            if (!state.fileExpiresAt || Notification.permission !== 'granted') return;
            const delay = state.fileExpiresAt - Date.now() - 15 * 60 * 1000;
            if (delay <= 0) return;
            const name = state.fileName;
            expiryNotifyTimer = setTimeout(() => {
                new Notification('Scanly — QR link expiring', {
                    body: `The link for ${name} expires in about 15 minutes.`,
                });
            }, delay);
        }

        async function armExpiryReminder() {
            if (!('Notification' in window)) { toast('This browser has no notification support', 'error'); return; }
            let perm = Notification.permission;
            if (perm === 'default') perm = await Notification.requestPermission();
            if (perm !== 'granted') { toast('Notification permission was not granted', 'error'); return; }
            scheduleExpiryNotification();
            toast('Reminder set for 15 min before expiry', 'success');
        }

        async function extractDocxText(file) {
            const buffer = await file.arrayBuffer();
            const result = await mammoth.extractRawText({ arrayBuffer: buffer });
            return result.value.trim();
        }

        function attachGlobalListeners() {
            // Type bar clicks
            document.getElementById('type-bar').addEventListener('click', e => {
                const btn = e.target.closest('.type-pill');
                if (!btn) return;
                const type = btn.dataset.type;
                if (type === state.currentType) return;
                state.currentType = type;
                renderTypeBar();
                renderForm();
                scheduleUpdate();
            });

            // Color pickers
            document.getElementById('fg-color').addEventListener('input', e => { state.fgColor = e.target.value; updateQRStyle(); });
            document.getElementById('bg-color').addEventListener('input', e => { state.bgColor = e.target.value; updateQRStyle(); });
            document.getElementById('corner-color').addEventListener('input', e => { state.cornerColor = e.target.value; updateQRStyle(); });
            document.getElementById('frame-color').addEventListener('input', e => { state.frameColor = e.target.value; updateQRStyle(); });
            document.getElementById('frame-text').addEventListener('input', e => { state.frameText = e.target.value; updateQRStyle(); });
            document.getElementById('grad-end').addEventListener('input', e => { state.gradEndColor = e.target.value; updateQRStyle(); });
            document.getElementById('grad-rot').addEventListener('input', e => {
                state.gradRotation = parseInt(e.target.value);
                document.getElementById('grad-rot-val').textContent = e.target.value;
                updateQRStyle();
            });

            // Gradient toggle
            const gradToggle = document.getElementById('gradient-toggle');
            gradToggle.addEventListener('click', () => {
                state.useGradient = !state.useGradient;
                gradToggle.classList.toggle('on', state.useGradient);
                gradToggle.setAttribute('aria-checked', state.useGradient);
                document.getElementById('gradient-opts').classList.toggle('hidden', !state.useGradient);
                updateQRStyle();
            });
            gradToggle.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); gradToggle.click(); } });

            // Style buttons (delegated)
            document.getElementById('dot-styles').addEventListener('click', e => {
                const btn = e.target.closest('.style-btn');
                if (!btn) return;
                state.dotStyle = btn.dataset.val;
                renderStyleButtons('dot-styles', dotStyles, 'dotStyle');
                updateQRStyle();
            });
            document.getElementById('corner-styles').addEventListener('click', e => {
                const btn = e.target.closest('.style-btn');
                if (!btn) return;
                state.cornerStyle = btn.dataset.val;
                renderStyleButtons('corner-styles', cornerStyles, 'cornerStyle');
                updateQRStyle();
            });
            document.getElementById('frame-styles').addEventListener('click', e => {
                const btn = e.target.closest('.style-btn');
                if (!btn) return;
                state.frameStyle = btn.dataset.val;
                state.frameIcon = null;
                state.framePresetId = null;
                renderStyleButtons('frame-styles', frameStyles, 'frameStyle');
                syncFramePresetActive();
                syncFrameOptionsVisibility();
                updateQRStyle();
            });
            document.getElementById('frame-presets').addEventListener('click', e => {
                const btn = e.target.closest('.frame-preset-card');
                if (!btn) return;
                const preset = framePresets.find(p => p.id === btn.dataset.id);
                if (!preset) return;
                state.framePresetId = preset.id;
                state.frameStyle = preset.shape;
                state.frameIcon = preset.icon;
                state.frameColor = preset.color;
                state.frameText = preset.text;
                document.getElementById('frame-color').value = preset.color;
                document.getElementById('frame-text').value = preset.text;
                renderStyleButtons('frame-styles', frameStyles, 'frameStyle');
                syncFramePresetActive();
                syncFrameOptionsVisibility();
                updateQRStyle();
            });
            document.getElementById('ec-levels').addEventListener('click', e => {
                const btn = e.target.closest('.style-btn');
                if (!btn) return;
                state.errorCorrection = btn.dataset.val;
                renderStyleButtons('ec-levels', ecLevels, 'errorCorrection', { title: e => `${e.desc} recovery` });
                updateQRStyle();
            });
            document.getElementById('size-btns').addEventListener('click', e => {
                const btn = e.target.closest('.style-btn');
                if (!btn) return;
                state.downloadSize = parseInt(btn.dataset.val);
                renderStyleButtons('size-btns', sizes, 'downloadSize', { suffix: 'px' });
            });

            // Logo upload
            const uploadZone = document.getElementById('upload-zone');
            const logoInput = document.getElementById('logo-input');
            uploadZone.addEventListener('click', e => {
                if (e.target.closest('#remove-logo')) return;
                logoInput.click();
            });
            uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.style.borderColor = 'rgba(255,92,57,0.5)'; });
            uploadZone.addEventListener('dragleave', () => { uploadZone.style.borderColor = ''; });
            uploadZone.addEventListener('drop', e => {
                e.preventDefault(); uploadZone.style.borderColor = '';
                if (e.dataTransfer.files.length) handleLogoFile(e.dataTransfer.files[0]);
            });
            logoInput.addEventListener('change', () => { if (logoInput.files.length) handleLogoFile(logoInput.files[0]); });

            document.getElementById('remove-logo').addEventListener('click', e => {
                e.stopPropagation();
                state.logoDataUrl = null;
                logoInput.value = '';
                document.getElementById('upload-placeholder').classList.remove('hidden');
                document.getElementById('upload-preview').classList.add('hidden');
                uploadZone.classList.remove('has-logo');
                updateQRStyle();
                toast('Logo removed', 'info');
            });

            // Download buttons
            document.getElementById('btn-png').addEventListener('click', () => downloadQR('png'));
            document.getElementById('btn-svg').addEventListener('click', () => downloadQR('svg'));
            document.getElementById('btn-copy').addEventListener('click', copyQR);
        }

        /* ===== Logo Handler ===== */
        function handleLogoFile(file) {
            if (!file.type.startsWith('image/')) { toast('Please upload an image file', 'error'); return; }
            if (file.size > 2 * 1024 * 1024) { toast('Image must be under 2MB', 'error'); return; }
            const reader = new FileReader();
            reader.onload = e => {
                state.logoDataUrl = e.target.result;
                document.getElementById('logo-preview-img').src = e.target.result;
                document.getElementById('upload-placeholder').classList.add('hidden');
                document.getElementById('upload-preview').classList.remove('hidden');
                document.getElementById('upload-zone').classList.add('has-logo');
                updateQRStyle();
                toast('Logo added successfully', 'success');
            };
            reader.readAsDataURL(file);
        }

        /* ===== Download ===== */
        function downloadQR(ext) {
            const data = getQRData(state.currentType);
            if (!data) { toast('Enter some data first', 'error'); return; }
            let dlQR;
            try {
                dlQR = new QRCodeStyling(buildQROptions(data, state.downloadSize));
            } catch (err) {
                if (state.errorCorrection === 'L') { toast(qrErrorMessage(err), 'error'); return; }
                const opts = buildQROptions(data, state.downloadSize);
                opts.qrOptions.errorCorrectionLevel = 'L';
                try {
                    dlQR = new QRCodeStyling(opts);
                    state.errorCorrection = 'L';
                    renderStyleButtons('ec-levels', ecLevels, 'errorCorrection', { title: e => `${e.desc} recovery` });
                    updateCapacityIndicator();
                    toast('Content is large — switched error correction to L to fit it.', 'info');
                } catch (err2) {
                    toast(qrErrorMessage(err2, 'L'), 'error');
                    return;
                }
            }
            if (state.frameStyle === 'none') {
                const tempDiv = document.createElement('div');
                tempDiv.style.position = 'fixed';
                tempDiv.style.left = '-9999px';
                document.body.appendChild(tempDiv);
                dlQR.append(tempDiv);
                setTimeout(() => {
                    dlQR.download({ name: 'scanly-qr', extension: ext });
                    document.body.removeChild(tempDiv);
                    toast(`Downloaded as ${ext.toUpperCase()}`, 'success');
                }, 200);
                return;
            }

            // Frame is a canvas composite, so download it directly instead of
            // going through the library's own (frame-unaware) exporter.
            getQRImage(dlQR).then(qrImage => {
                const framed = composeFramedCanvas(qrImage, state.downloadSize);
                const link = document.createElement('a');
                if (ext === 'png') {
                    link.download = 'scanly-qr.png';
                    link.href = framed.toDataURL('image/png');
                } else {
                    // SVG with a frame embeds the composited PNG in a minimal SVG wrapper
                    // (a hand-built vector frame + vector QR is a lot more code for little
                    // practical gain here) — still a valid, correctly-styled SVG file.
                    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${framed.width}" height="${framed.height}" viewBox="0 0 ${framed.width} ${framed.height}"><image width="${framed.width}" height="${framed.height}" href="${framed.toDataURL('image/png')}"/></svg>`;
                    link.download = 'scanly-qr.svg';
                    link.href = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' }));
                }
                link.click();
                toast(`Downloaded as ${ext.toUpperCase()}`, 'success');
            }).catch(() => toast('Download failed. Try again.', 'error'));
        }

        function copyQR() {
            const data = getQRData(state.currentType);
            if (!data) { toast('Enter some data first', 'error'); return; }
            const canvas = document.querySelector('#qr-container canvas');
            if (!canvas) { toast('No QR code to copy', 'error'); return; }
            canvas.toBlob(blob => {
                if (!blob) { toast('Failed to copy', 'error'); return; }
                try {
                    navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]).then(() => {
                        toast('Copied to clipboard', 'success');
                    }).catch(() => {
                        toast('Clipboard access denied', 'error');
                    });
                } catch {
                    toast('Clipboard not supported in this browser', 'error');
                }
            }, 'image/png');
        }

        /* ===== Toast ===== */
        function toast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const icons = { success: 'fa-circle-check', error: 'fa-circle-xmark', info: 'fa-circle-info' };
            const el = document.createElement('div');
            el.className = `toast ${type}`;
            el.innerHTML = `<i class="fa-solid ${icons[type]}"></i><span>${message}</span>`;
            container.appendChild(el);
            setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 3000);
        }

        // Canvas text draws with whatever fonts are loaded at that moment, so frames and
        // gallery thumbnails must wait for the webfonts or their icons/captions come out blank.
        async function ensureFontsReady() {
            if (!document.fonts) return;
            try {
                await Promise.all([
                    document.fonts.load('900 16px "Font Awesome 6 Free"'),
                    document.fonts.load('700 16px "Space Grotesk"'),
                ]);
                await document.fonts.ready;
            } catch (err) {
                /* fonts unavailable — frames still render, just with fallback text */
            }
        }

        /* ===== Theme =====
           Follows the OS by default; an explicit choice is remembered. The frame artwork is
           redrawn on switch because thumbnails are baked canvases, not live DOM. */
        const THEME_KEY = 'scanly-theme';

        function applyTheme(mode, { redraw = true } = {}) {
            document.documentElement.setAttribute('data-theme', mode);
            const icon = document.getElementById('theme-icon');
            if (icon) icon.className = mode === 'light' ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
            const btn = document.getElementById('theme-toggle');
            if (btn) btn.title = mode === 'light' ? 'Switch to dark' : 'Switch to warm light';
            if (redraw && framePresetThumbs) {
                framePresetThumbs = null;      // thumbnails bake the tile colour in
                renderFramePresets();
            }
        }

        function initTheme() {
            let stored = null;
            try { stored = localStorage.getItem(THEME_KEY); } catch (err) { /* private mode */ }
            const mode = stored || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
            applyTheme(mode, { redraw: false });

            document.getElementById('theme-toggle').addEventListener('click', () => {
                const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
                applyTheme(next);
                try { localStorage.setItem(THEME_KEY, next); } catch (err) { /* ignore */ }
            });

            // Keep following the OS until the user picks a side themselves
            if (!stored) {
                window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', e => {
                    try { if (localStorage.getItem(THEME_KEY)) return; } catch (err) { /* ignore */ }
                    applyTheme(e.matches ? 'light' : 'dark');
                });
            }
        }

        /* ===== Init ===== */
        async function init() {
            initTheme();
            renderTypeBar();
            renderForm();
            renderStyleButtons('dot-styles', dotStyles, 'dotStyle');
            renderStyleButtons('corner-styles', cornerStyles, 'cornerStyle');
            renderStyleButtons('frame-styles', frameStyles, 'frameStyle');
            syncFrameOptionsVisibility();
            renderStyleButtons('ec-levels', ecLevels, 'errorCorrection', { title: e => `${e.desc} recovery` });
            renderStyleButtons('size-btns', sizes, 'downloadSize', { suffix: 'px' });
            attachGlobalListeners();
            updateCapacityIndicator();
            await ensureFontsReady();
            const calibNotes = calibrateFrameShapes();
            if (calibNotes.length) console.warn('frame calibration:', calibNotes);
            renderFramePresets();
            initQR();
        }

        // Wait for QRCodeStyling to be available
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => setTimeout(init, 100));
        } else {
            setTimeout(init, 100);
        }
    </script>
</body>
</html>
